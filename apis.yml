name: Remedyskin
description: 'Remedyskin (Remedy Science, operated by Doctorly Skin Inc.) is a dermatologist-developed
  skincare and beauty brand founded by Dr. Muneeb Shah. It sells a direct-to-consumer line of advanced
  skincare treatments organized by concern (dark spots, aging, pore size, body texture) and skin type,
  spanning cleansers, treatment serums, moisturizers, targeted solutions, and bundles, built around a
  "Do No Harm" formulation principle that excludes fragrances and common irritants. The storefront runs
  on Shopify with a Gorgias-powered help center and mobile apps on iOS and Android. It was surfaced as
  a portfolio company of norwest-venture-partners. Enrichment found no public API, developer portal, or
  SDK surface — this is a consumer e-commerce brand with no developer program.'
